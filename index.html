<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App finanças</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Finanças App</h1>
        <p>organize seu orçamento e simule investimentos</p>
    </header>
    <main>
        <section id="orcamento">
            <h2>orçamento mensal</h2>
            <form id="form-renda">
                <label for="renda">Renda mensal (R$)</label>
                <input type="number" id="renda" min="0" step="0.01" required>
                <button type="submit">definir renda</button>
            </form>
            <form id="form-despesa">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" required>
                <label for="valor-despesa">Valor (R$)</label>
                <input type="number" id="valor-despesa" min="0" step="0.01" required>
                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="Moradia">Moradia</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Estudos">Estudos</option>
                </select>
                <button type="submit">Adicionar despesas</button>
            </form>
        </section>

        <section class="resumo" id="resumo">
            <h2>resumo do mês</h2>
            <div class="cards">
                <div class="card">
                    <span class="card-titulo">Renda</span>
                    <strong class="card-valor" id="resumo-renda">R$ 0,00</strong>
                </div>

                <div class="card">
                    <span class="card-titulo">Total gasto</span>
                    <strong class="card-valor" id="resumo-gasto">R$ 0,00</strong>
                </div>

                <div class="card">
                    <span class="card-titulo">Saldo</span>
                    <strong class="card-valor" id="resumo-saldo">R$ 0,00</strong>
                </div>

                <div class="card">
                    <span class="card-titulo">Renda comprometida</span>
                    <strong class="card-valor" id="resumo-percentual">0%</strong>
                </div>
            </div>
        </section>

        <section class="despesas" id="despesas">
            <h2>despesas cadastradas</h2>
            <p class="lista-vazia" id="lista-vazia">nenhuma despesa cadastrada ainda.</p>
            <ul class="lista-despesas" id="lista-despesas">
                <!--as despesas serão inseridas aqui pelo js-->
            </ul>
            <button type="button" id="btn-limpar" class="btn-perigo">limpar tudo</button>
        </section>
    </main>
    <script src="js/storage.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
