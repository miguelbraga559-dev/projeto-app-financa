<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App finanças</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Finanças App</h1>
        <p>organize seu orçamento e simule investimentos</p>
    </header>
    <main>
        <section id="orcamento">
            <h2>orçamento mensal</h2>
            <form id="form-renda">
                <label for="renda">Renda mensal (R$)</label>
                <input type="number" id="renda" min="0" step="0.01" required>
                <button type="submit">definir renda</button>
            </form>
        </section>
    </main>
</body>
</html>
